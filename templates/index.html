<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term1nal_Strength_Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Using a cool hacker/mono font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="prompt">>_</span> PASS_EVAL_SYS</h1>
            <p class="subtitle">Neural network entropy evaluation & synthesis</p>
        </header>

        <main>
            <section class="card checker-section">
                <h2>[ EVALUATE ]</h2>
                <div class="input-group">
                    <input type="text" id="password-input" placeholder="Enter target sequence..." autocomplete="off">
                    <button id="toggle-visibility" class="btn btn-icon" title="Toggle visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                
                <div class="strength-meter">
                    <div class="meter-bar-container">
                        <div id="meter-bar" class="meter-bar"></div>
                    </div>
                    <div class="meter-labels">
                        <span id="strength-text">Initializing...</span>
                        <span id="entropy-text">0.00 bits</span>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Length (L)</span>
                        <span id="stat-length" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Pool Size (R)</span>
                        <span id="stat-pool" class="stat-value">0</span>
                    </div>
                    <div class="stat-box crack-time-box">
                        <span class="stat-label">Brute Force Time</span>
                        <span id="stat-crack-time" class="stat-value time-value">Instantly</span>
                    </div>
                </div>
            </section>

            <section class="card educational-section">
                <h2>[ REGEX_ANALYSIS ]</h2>
                <p class="section-desc">Detecting character sets to determine entropy pool (R)</p>
                <div id="feedback-list" class="feedback-list">
                    <!-- Feedback items generated by JS -->
                </div>
                <div class="entropy-formula">
                    <code>Entropy (E) = L × log₂(R)</code>
                </div>
            </section>

            <section class="card generator-section">
                <h2>[ GENERATE ]</h2>
                <div class="gen-controls">
                    <div class="control-group">
                        <label for="gen-length">Length: <span id="gen-length-val">16</span></label>
                        <input type="range" id="gen-length" min="8" max="64" value="16">
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="gen-upper" checked> [A-Z]
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="gen-numbers" checked> \d
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="gen-symbols" checked> [^a-zA-Z0-9]
                        </label>
                    </div>
                    <div class="action-row">
                        <button id="btn-generate" class="btn btn-primary">EXECUTE_GEN</button>
                        <div class="generated-output-group">
                            <input type="text" id="generated-password" readonly placeholder="Output stream...">
                            <button id="btn-copy" class="btn btn-secondary">COPY</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
